name: Build release runtimes
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release containing temporary private build input
        required: true
        default: v0.04
      input_sha256:
        description: SHA256 of the temporary generated build input archive
        required: true
      platforms:
        description: Platform names as a JSON array
        required: true
        default: '["Windows-x64","Windows-x86","Linux-x64","macOS-arm64","macOS-x64"]'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: Windows-x64
            msystem: MINGW64
            prefix: mingw-w64-x86_64
          - runner: windows-2022
            platform: Windows-x86
            msystem: MINGW32
            prefix: mingw-w64-i686
          - runner: ubuntu-22.04
            platform: Linux-x64
          - runner: macos-15
            platform: macOS-arm64
          - runner: macos-15-intel
            platform: macOS-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        if: contains(fromJSON(inputs.platforms), matrix.platform)
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        if: contains(fromJSON(inputs.platforms), matrix.platform)
        with:
          python-version: '3.13'
      - name: Restore temporary private build input
        if: contains(fromJSON(inputs.platforms), matrix.platform)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_SHA256: ${{ inputs.input_sha256 }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern v002-build-input.zip --dir "$RUNNER_TEMP"
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'v002-build-input.zip'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['INPUT_SHA256']
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  assert not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts
                  assert n.startswith('src/gen/') or n=='recomp/funcs.h'
              z.extractall('.')
          p.unlink()
          PY
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && contains(fromJSON(inputs.platforms), matrix.platform)
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-python
      - name: Build and test Windows
        if: runner.os == 'Windows' && contains(fromJSON(inputs.platforms), matrix.platform)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_BUILD_VERSION=0.04 -DBUILD_TESTING=ON -DDOOM_ENABLE_IPO=ON -DDOOM_ASYNC_PRESENTATION=ON -DDOOM_WINDOWS_CONSOLE=OFF -DDOOM_DIAGNOSTIC_BUILD=OFF -DDOOM_SNESED_TEST=OFF
          cmake --build build-release --parallel 4
          ctest --test-dir build-release --output-on-failure
          python scripts/stage_runtime.py --platform '${{ matrix.platform }}'
          bash snesrecomp/tools/ci/bundle_runtime_libs.sh --exe 'dist/DoomSNESRecomp-v0.04-${{ matrix.platform }}/DoomSNESRecomp.exe' --build-dir build-release --strict
          python scripts/stage_runtime.py --platform '${{ matrix.platform }}' --zip
      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && contains(fromJSON(inputs.platforms), matrix.platform)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libudev-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libdrm-dev libgbm-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS' && contains(fromJSON(inputs.platforms), matrix.platform)
        run: brew install ninja dylibbundler
      - name: Build and test Unix
        if: runner.os != 'Windows' && contains(fromJSON(inputs.platforms), matrix.platform)
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ '${{ runner.os }}' == macOS ]]; then
            extra+=(-DCMAKE_DISABLE_FIND_PACKAGE_Freetype=ON)
          fi
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNESRECOMP_BUILD_VERSION=0.04 -DBUILD_TESTING=ON -DDOOM_ENABLE_IPO=ON -DDOOM_ASYNC_PRESENTATION=ON -DDOOM_WINDOWS_CONSOLE=OFF -DDOOM_DIAGNOSTIC_BUILD=OFF -DDOOM_SNESED_TEST=OFF -DCMAKE_BUILD_RPATH='$ORIGIN' "${extra[@]}"
          cmake --build build-release --parallel 3
          ctest --test-dir build-release --output-on-failure
          python scripts/stage_runtime.py --platform '${{ matrix.platform }}'
          stage='dist/DoomSNESRecomp-v0.04-${{ matrix.platform }}'
          bash snesrecomp/tools/ci/bundle_runtime_libs.sh --exe "$stage/DoomSNESRecomp" --build-dir build-release --strict
          if [[ '${{ runner.os }}' == macOS ]]; then
            find "$stage/libs" -name '*.dylib' -exec codesign --force --sign - {} \;
            codesign --force --sign - "$stage/DoomSNESRecomp"
            codesign --verify "$stage/DoomSNESRecomp"
          fi
          python scripts/stage_runtime.py --platform '${{ matrix.platform }}' --zip
      - uses: actions/upload-artifact@v6
        if: contains(fromJSON(inputs.platforms), matrix.platform)
        with:
          name: ${{ matrix.platform }}
          path: dist/DoomSNESRecomp-v0.04-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 7
