format_version = 1
id = "doom.presentation"
version = "1.0.0"
name = "Doom Display Enhancements"
author = "DoomSNESRecomp contributors"
description = "Adaptive widescreen and interpolated camera presentation."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "doom-y"
rom_sha256 = "d45e26eb10c323ecd480e5f2326b223e29264c3adde67f48f0d2791128e519e8"

[[feature]]
id = "widescreen"
name = "Adaptive widescreen"
description = "Expand the world view to the selected aspect ratio. Fit follows the window; the status bar stays centered."
group = "Presentation"
default_enabled = false
presentation_only = true

[[plugin]]
feature = "widescreen"
id = "doom.presentation.widescreen"

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
type = "choice"
default = "Fit"

[[option.choice]]
value = "4:3"
label = "4:3"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[option.choice]]
value = "32:9"
label = "32:9"

[[option.choice]]
value = "Fit"
label = "Fit to window"

[[feature]]
id = "presentation-fps"
name = "Interpolated frame rate"
description = "Interpolate the camera at the selected presentation rate while keeping the original game speed. Works at 4:3 and widescreen."
group = "Presentation"
default_enabled = false
presentation_only = true

[[plugin]]
feature = "presentation-fps"
id = "doom.presentation.fps"

[[option]]
feature = "presentation-fps"
id = "fps"
label = "Presentation FPS"
type = "choice"
default = "Auto"

[[option.choice]]
value = "Auto"
label = "Auto (display refresh)"

[[option.choice]]
value = "60"
label = "60"

[[option.choice]]
value = "90"
label = "90"

[[option.choice]]
value = "120"
label = "120"

[[option.choice]]
value = "144"
label = "144"

[[option.choice]]
value = "165"
label = "165"

[[option.choice]]
value = "240"
label = "240"

[[option.choice]]
value = "360"
label = "360"
