format_version = 1
id = "doom.presentation"
version = "1.0.0"
name = "Doom Display Enhancements"
author = "DoomSNESRecomp contributors"
description = "Display enhancements and optional modern keyboard and mouse controls."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "doom-y"
rom_sha256 = "d45e26eb10c323ecd480e5f2326b223e29264c3adde67f48f0d2791128e519e8"

[[feature]]
id = "widescreen"
name = "Adaptive widescreen"
description = "Expand the world view to the selected aspect ratio. Fit follows the window; the status bar stays centered."
group = "Presentation"
default_enabled = false
presentation_only = true

[[plugin]]
feature = "widescreen"
id = "doom.presentation.widescreen"

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
type = "choice"
default = "Fit"

[[option.choice]]
value = "4:3"
label = "4:3"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[option.choice]]
value = "32:9"
label = "32:9"

[[option.choice]]
value = "Fit"
label = "Fit to window"

[[feature]]
id = "presentation-fps"
name = "Interpolated frame rate"
description = "Interpolate the camera and weapon sway at the selected presentation rate while keeping the original game speed. Works at 4:3 and widescreen."
group = "Presentation"
default_enabled = false
presentation_only = true

[[plugin]]
feature = "presentation-fps"
id = "doom.presentation.fps"

[[option]]
feature = "presentation-fps"
id = "fps"
label = "Presentation FPS"
type = "choice"
default = "Auto"

[[option.choice]]
value = "Auto"
label = "Auto (display refresh)"

[[option.choice]]
value = "60"
label = "60"

[[option.choice]]
value = "90"
label = "90"

[[option.choice]]
value = "120"
label = "120"

[[option.choice]]
value = "144"
label = "144"

[[option.choice]]
value = "165"
label = "165"

[[option.choice]]
value = "240"
label = "240"

[[option.choice]]
value = "360"
label = "360"

[[feature]]
id = "render-resolution"
name = "Higher 3D resolution"
description = "Render world geometry and wall textures at a higher resolution. Objects are sampled from original artwork at the selected resolution; HUD and weapons retain their original pixel art. Higher levels require more CPU time."
group = "Presentation"
default_enabled = false
presentation_only = true

[[plugin]]
feature = "render-resolution"
id = "doom.presentation.resolution"

[[option]]
feature = "render-resolution"
id = "scale"
label = "3D resolution"
type = "choice"
default = "2"

[[option.choice]]
value = "2"
label = "2x (432 x 288 at 4:3)"

[[option.choice]]
value = "3"
label = "3x (648 x 432 at 4:3)"

[[option.choice]]
value = "4"
label = "4x (864 x 576 at 4:3)"

[[feature]]
id = "modern-controls"
name = "Modern keyboard + mouse"
description = "W/S move, A/D strafe, Shift runs, E uses doors/switches, Enter pauses. Left mouse fires; mouse turns and shifts the horizon for classic vertical look. Escape releases the cursor; click to capture it again."
group = "Controls"
default_enabled = false
presentation_only = false

[[plugin]]
feature = "modern-controls"
id = "doom.controls.modern"

[[option]]
feature = "modern-controls"
id = "sensitivity"
label = "Mouse sensitivity"
type = "choice"
default = "1"
[[option.choice]]
value = "0.5"
label = "0.5x"
[[option.choice]]
value = "1"
label = "1x (SNES mouse scale)"
[[option.choice]]
value = "1.5"
label = "1.5x"
[[option.choice]]
value = "2"
label = "2x"

[[option]]
feature = "modern-controls"
id = "vertical-look"
label = "Classic vertical look"
type = "choice"
default = "on"
[[option.choice]]
value = "on"
label = "On"
[[option.choice]]
value = "off"
label = "Off (horizontal mouse only)"

[[option]]
feature = "modern-controls"
id = "invert-y"
label = "Invert mouse Y"
type = "choice"
default = "off"
[[option.choice]]
value = "off"
label = "Off"
[[option.choice]]
value = "on"
label = "On"
